name: Build Production Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official libXray
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip -o /tmp/libxray.zip
          AAR="$(unzip -Z1 /tmp/libxray.zip | grep -E '(^|/)libXray\.aar$' | head -n1)"
          test -n "$AAR"
          unzip -p /tmp/libxray.zip "$AAR" > app/libs/libXray.aar
          test -s app/libs/libXray.aar

      - name: Install embedded server configuration
        shell: bash
        env:
          REVPN_SERVER_CONFIG_BASE64: ${{ secrets.REVPN_SERVER_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$REVPN_SERVER_CONFIG_BASE64"
          printf '%s' "$REVPN_SERVER_CONFIG_BASE64" | base64 -d > app/src/main/assets/servers.json
          jq -e '.servers | length > 0' app/src/main/assets/servers.json >/dev/null

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/revpn-release.jks"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/revpn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: ReVPN-production
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
