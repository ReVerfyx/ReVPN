name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download official libXray
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip -o /tmp/libxray.zip
          AAR="$(unzip -Z1 /tmp/libxray.zip | grep -E '(^|/)libXray\.aar$' | head -n1)"
          test -n "$AAR"
          unzip -p /tmp/libxray.zip "$AAR" > app/libs/libXray.aar
          test -s app/libs/libXray.aar
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
